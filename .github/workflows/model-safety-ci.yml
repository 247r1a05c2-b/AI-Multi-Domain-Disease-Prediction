name: Model Safety CI

on:
  push:
    branches: [main, readiness/no-fake-predictions]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-model-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pip numpy pytest
      - name: Run model safety tests
        working-directory: BioVisionAI
        run: python -m pytest -q tests
